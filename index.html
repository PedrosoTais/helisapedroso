<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Helisa Pedroso | Especialista em Limpeza — limpeza profissional em Benavente e região. Novo site em construção.">
  <meta name="robots" content="index,follow">
  <title>Helisa Pedroso Cleaner | Site em construção</title>
  <style>
    :root{
      --creme:#f7f0e8;
      --creme-claro:#fffaf5;
      --taupe:#a87d62;
      --taupe-escuro:#6f4f3d;
      --texto:#4d3a30;
      --branco:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--creme);color:var(--texto)}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 20px 120px;
      background:
        radial-gradient(circle at 50% 35%, var(--creme-claro) 0%, var(--creme) 68%);
    }
    main{
      width:min(760px,100%);
      text-align:center;
    }
    .logo{
      display:block;
      width:min(360px,80vw);
      height:auto;
      margin:0 auto 18px;
      border-radius:24px;
      mix-blend-mode:multiply;
    }
    .linha{
      width:64px;
      height:1px;
      background:var(--taupe);
      margin:12px auto 26px;
      opacity:.65;
    }
    h1{
      margin:0 0 14px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(30px,5vw,48px);
      font-weight:400;
      letter-spacing:.02em;
      color:var(--taupe-escuro);
    }
    p{
      max-width:580px;
      margin:0 auto;
      font-size:clamp(16px,2.4vw,19px);
      line-height:1.65;
    }
    .local{
      margin-top:18px;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--taupe);
    }
    .whatsapp{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:220px;
      padding:15px 24px;
      border-radius:999px;
      background:var(--taupe-escuro);
      color:var(--branco);
      text-decoration:none;
      font-weight:700;
      box-shadow:0 12px 30px rgba(79,55,43,.22);
      transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      z-index:10;
    }
    .whatsapp:hover{
      transform:translateX(-50%) translateY(-2px);
      box-shadow:0 15px 34px rgba(79,55,43,.28);
      background:#5e4233;
    }
    .whatsapp svg{width:21px;height:21px;fill:currentColor}
    @media (max-width:480px){
      body{padding-top:18px}
      .logo{width:min(310px,88vw)}
      .whatsapp{bottom:18px;width:calc(100% - 36px);max-width:340px}
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo-helisa.jpeg" alt="Helisa Pedroso Cleaner">
    <div class="linha"></div>
    <h1>Estamos a preparar algo especial.</h1>
    <p>
      O novo site da <strong>Helisa Pedroso | Especialista em Limpeza</strong> está em construção.
      Em breve poderá conhecer os nossos serviços, trabalhos e solicitar o seu orçamento por aqui.
    </p>
    <div class="local">Benavente e região · Portugal</div>
  </main>

  <a class="whatsapp"
     href="https://wa.me/351915726551?text=Ol%C3%A1%21%20Encontrei%20a%20Helisa%20Pedroso%20Cleaner%20atrav%C3%A9s%20do%20site%20e%20gostaria%20de%20pedir%20um%20or%C3%A7amento."
     target="_blank" rel="noopener noreferrer"
     aria-label="Entrar em contacto pelo WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.52 3.48A11.82 11.82 0 0 0 12.08 0C5.54 0 .22 5.32.22 11.86c0 2.09.55 4.13 1.6 5.93L.12 24l6.36-1.67a11.86 11.86 0 0 0 5.59 1.42h.01c6.54 0 11.86-5.32 11.86-11.86 0-3.17-1.22-6.15-3.42-8.41ZM12.08 21.75h-.01a9.82 9.82 0 0 1-5.01-1.37l-.36-.21-3.77.99 1.01-3.67-.24-.38a9.8 9.8 0 0 1-1.5-5.25c0-5.44 4.43-9.87 9.88-9.87a9.8 9.8 0 0 1 6.98 2.9 9.8 9.8 0 0 1 2.89 6.99c0 5.44-4.43 9.87-9.87 9.87Zm5.42-7.39c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47a8.9 8.9 0 0 1-1.65-2.05c-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.08.15.2 2.1 3.21 5.09 4.5.71.31 1.27.49 1.7.63.71.23 1.36.19 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35Z"/>
    </svg>
    Entre em contacto
  </a>
</body>
</html>
